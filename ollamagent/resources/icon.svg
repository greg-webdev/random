<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Shield -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#18181b" stroke="url(#grad1)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Llama / Agent Head Silhouette -->
  <path d="M 44 96 L 44 68 C 44 60 48 54 54 50 L 54 36 C 54 32 58 28 62 28 C 66 28 70 32 70 36 L 70 42 C 72 40 76 40 78 42 C 82 46 84 52 84 58 L 84 96 Z" fill="url(#grad1)" />
  
  <!-- Ears -->
  <polygon points="56,28 50,16 58,24" fill="#a855f7" />
  <polygon points="68,28 74,16 66,24" fill="#6366f1" />
  
  <!-- Glowing Eye / Sensor -->
  <circle cx="72" cy="50" r="4.5" fill="#38bdf8" />
  <circle cx="73" cy="49" r="1.5" fill="#ffffff" />
  
  <!-- Terminal / Code Prompt Accent -->
  <path d="M 48 80 L 56 86 L 48 92" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="60" y1="92" x2="70" y2="92" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
