<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>History</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1c23;
      color: #e5e7eb;
      padding: 30px;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      color: #38bdf8;
    }
    .search-input {
      background: #252834;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 14px;
      color: #f3f4f6;
      font-size: 14px;
      outline: none;
      width: 260px;
    }
    .search-input:focus {
      border-color: #3b82f6;
    }
    .clear-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }
    .clear-btn:hover {
      background: #ef4444;
      color: #ffffff;
    }
    .history-list {
      background: #252834;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .history-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      gap: 14px;
      transition: background 0.12s;
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .history-item:hover {
      background: #323746;
    }
    .history-time {
      font-size: 12px;
      color: #9ca3af;
      min-width: 65px;
      font-family: monospace;
    }
    .history-title {
      font-size: 14px;
      font-weight: 500;
      color: #f3f4f6;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .history-title:hover {
      text-decoration: underline;
      color: #60a5fa;
    }
    .history-url {
      font-size: 12px;
      color: #6b7280;
      max-width: 250px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty-state {
      padding: 40px;
      text-align: center;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <h1>Browsing History</h1>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="history-search" class="search-input" placeholder="Search history..." />
        <button id="clear-history" class="clear-btn">Clear Browsing Data</button>
      </div>
    </div>

    <div class="history-list" id="history-list">
      <div class="empty-state">Loading history...</div>
    </div>
  </div>

  <script>
    let allHistory = [];
    async function loadHistory() {
      if (window.parent && window.parent.browserAPI) {
        allHistory = await window.parent.browserAPI.getHistory();
      } else {
        allHistory = [
          { title: 'Google', url: 'https://www.google.com', timestamp: Date.now() - 60000 },
          { title: 'Chromium Dino', url: 'chrome://dino', timestamp: Date.now() - 360000 }
        ];
      }
      render(allHistory);
    }

    function render(items) {
      const container = document.getElementById('history-list');
      if (!items || items.length === 0) {
        container.innerHTML = '<div class="empty-state">No browsing history recorded yet.</div>';
        return;
      }
      container.innerHTML = items.map(item => {
        const timeStr = new Date(item.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return `
          <div class="history-item">
            <span class="history-time">${timeStr}</span>
            <a class="history-title" href="${item.url}">${item.title || item.url}</a>
            <span class="history-url">${item.url}</span>
          </div>
        `;
      }).join('');
    }

    document.getElementById('history-search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allHistory.filter(h => (h.title && h.title.toLowerCase().includes(q)) || (h.url && h.url.toLowerCase().includes(q)));
      render(filtered);
    });

    document.getElementById('clear-history').addEventListener('click', async () => {
      if (confirm('Are you sure you want to clear all history?')) {
        if (window.parent && window.parent.browserAPI) {
          allHistory = await window.parent.browserAPI.clearHistory();
        } else {
          allHistory = [];
        }
        render(allHistory);
      }
    });

    loadHistory();
  </script>
</body>
</html>
