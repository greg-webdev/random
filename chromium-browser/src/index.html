<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromium Browser</title>
  <link rel="stylesheet" href="styles/browser.css">
</head>
<body>
  <!-- Browser Chrome Top Bar -->
  <header id="browser-header">
    <!-- Tab Bar & Window Controls -->
    <div class="tabbar-container">
      <div id="tabs-list" class="tabs-list">
        <!-- Dynamic Tabs inserted here -->
      </div>
      <div id="new-tab-btn" class="new-tab-btn" title="New Tab (Ctrl+T)"></div>
      
      <!-- Window Controls -->
      <div class="window-controls">
        <div id="win-min-btn" class="win-btn" title="Minimize"></div>
        <div id="win-max-btn" class="win-btn" title="Maximize"></div>
        <div id="win-close-btn" class="win-btn win-close" title="Close"></div>
      </div>
    </div>

    <!-- Navigation & Omnibox Toolbar -->
    <div class="navbar-container">
      <button id="btn-back" class="nav-action-btn" title="Click to go back (Alt+Left)" disabled></button>
      <button id="btn-forward" class="nav-action-btn" title="Click to go forward (Alt+Right)" disabled></button>
      <button id="btn-reload" class="nav-action-btn" title="Reload this page (Ctrl+R)"></button>
      <button id="btn-home" class="nav-action-btn" title="Open Home Page"></button>

      <!-- Smart Omnibox -->
      <div class="omnibox-wrapper">
        <div id="security-badge" class="security-badge" title="Security Information"></div>
        <input id="omnibox-input" class="omnibox-input" type="text" placeholder="Search Google or enter a web address / chrome:// url" spellcheck="false" autocomplete="off" />
        <div class="omnibox-tools">
          <div id="btn-star" class="omnibox-tool-btn" title="Bookmark this tab (Ctrl+D)"></div>
          <div id="btn-devtools" class="omnibox-tool-btn" title="Inspect / Chrome DevTools (F12)"></div>
        </div>
      </div>

      <button id="btn-menu" class="nav-action-btn" title="Customize and control browser"></button>

      <!-- Loading Progress -->
      <div id="loading-bar" class="loading-bar"></div>
    </div>

    <!-- Bookmarks Bar -->
    <div id="bookmarks-bar" class="bookmarks-bar">
      <!-- Bookmarks dynamically rendered here -->
    </div>
  </header>

  <!-- Webviews Container -->
  <main id="views-container">
    <!-- Active and background <webview> tags dynamically attached here -->
  </main>

  <!-- Dropdown Menu -->
  <div id="dropdown-menu" class="dropdown-menu">
    <div class="menu-item" id="menu-new-tab">
      <span>New Tab</span>
      <span class="shortcut">Ctrl+T</span>
    </div>
    <div class="menu-item" id="menu-devtools">
      <span>Chrome DevTools</span>
      <span class="shortcut">F12</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="menu-history">
      <span>History</span>
      <span class="shortcut">Ctrl+H</span>
    </div>
    <div class="menu-item" id="menu-bookmarks">
      <span>Bookmarks</span>
      <span class="shortcut">Ctrl+B</span>
    </div>
    <div class="menu-item" id="menu-downloads">
      <span>Downloads</span>
      <span class="shortcut">Ctrl+J</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="menu-chrome-urls">
      <span>Chrome URLs (chrome://)</span>
    </div>
    <div class="menu-item" id="menu-dino">
      <span>Play Dino Game</span>
    </div>
    <div class="menu-item" id="menu-settings">
      <span>Settings</span>
    </div>
    <div class="menu-item" id="menu-about">
      <span>About Chromium</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="menu-exit">
      <span>Exit Browser</span>
      <span class="shortcut">Alt+F4</span>
    </div>
  </div>

  <!-- Find in page bar -->
  <div id="find-bar" class="find-bar">
    <input id="find-input" class="find-input" type="text" placeholder="Find in page..." />
    <span id="find-count" class="find-count">0/0</span>
    <button id="find-prev" class="find-btn" title="Previous">▲</button>
    <button id="find-next" class="find-btn" title="Next">▼</button>
    <button id="find-close" class="find-btn" title="Close">✕</button>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
