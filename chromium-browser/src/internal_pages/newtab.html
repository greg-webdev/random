<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Tab</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at center, #1e222d 0%, #12141a 100%);
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .logo {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #60a5fa, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .time-greeting {
      font-size: 14px;
      color: #9ca3af;
    }
    .search-box {
      width: 100%;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 12px 20px;
      gap: 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }
    .search-box:focus-within {
      background: rgba(255, 255, 255, 0.1);
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3), 0 12px 35px -5px rgba(0, 0, 0, 0.5);
    }
    .search-icon {
      color: #9ca3af;
      display: flex;
    }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 16px;
      color: #ffffff;
      font-family: inherit;
    }
    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
      margin-top: 10px;
    }
    .shortcut-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      text-decoration: none;
      color: #e5e7eb;
      transition: all 0.18s ease;
      cursor: pointer;
    }
    .shortcut-card:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }
    .shortcut-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .shortcut-title {
      font-size: 12.5px;
      font-weight: 500;
    }
    .bottom-tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
    }
    .chip {
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      font-size: 12px;
      color: #9ca3af;
      text-decoration: none;
      transition: all 0.15s;
    }
    .chip:hover {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <h1 class="logo">Chromium</h1>
      <div id="greeting" class="time-greeting">Welcome to Chromium Browser</div>
    </div>

    <form class="search-box" id="search-form">
      <div class="search-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </div>
      <input type="text" id="search-input" class="search-input" placeholder="Search the web or type a URL..." autofocus />
    </form>

    <div class="shortcuts-grid">
      <a class="shortcut-card" href="https://www.google.com">
        <div class="shortcut-icon" style="color: #4285f4;">🔍</div>
        <span class="shortcut-title">Google</span>
      </a>
      <a class="shortcut-card" href="https://www.youtube.com">
        <div class="shortcut-icon" style="color: #ff0000;">▶️</div>
        <span class="shortcut-title">YouTube</span>
      </a>
      <a class="shortcut-card" href="https://github.com">
        <div class="shortcut-icon">🐙</div>
        <span class="shortcut-title">GitHub</span>
      </a>
      <a class="shortcut-card" href="https://www.wikipedia.org">
        <div class="shortcut-icon">📖</div>
        <span class="shortcut-title">Wikipedia</span>
      </a>
      <a class="shortcut-card" href="chrome://version">
        <div class="shortcut-icon" style="color: #38bdf8;">ℹ️</div>
        <span class="shortcut-title">Version Info</span>
      </a>
      <a class="shortcut-card" href="chrome://about">
        <div class="shortcut-icon" style="color: #a855f7;">⚡</div>
        <span class="shortcut-title">Chrome URLs</span>
      </a>
      <a class="shortcut-card" href="chrome://history">
        <div class="shortcut-icon" style="color: #10b981;">🕒</div>
        <span class="shortcut-title">History</span>
      </a>
      <a class="shortcut-card" href="chrome://dino">
        <div class="shortcut-icon" style="color: #f59e0b;">🦖</div>
        <span class="shortcut-title">Dino Game</span>
      </a>
    </div>

    <div class="bottom-tags">
      <a class="chip" href="chrome://settings">Settings</a>
      <a class="chip" href="chrome://bookmarks">Bookmarks</a>
      <a class="chip" href="chrome://downloads">Downloads</a>
      <a class="chip" href="https://news.ycombinator.com">Hacker News</a>
      <a class="chip" href="https://reddit.com">Reddit</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('search-form');
    const input = document.getElementById('search-input');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = input.value.trim();
      if (!val) return;
      if (val.startsWith('http://') || val.startsWith('https://') || val.startsWith('chrome://') || val.startsWith('file:///')) {
        window.location.href = val;
      } else if (val.includes('.') && !val.includes(' ')) {
        window.location.href = 'https://' + val;
      } else {
        window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(val);
      }
    });

    // Update greeting
    const hour = new Date().getHours();
    const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    document.getElementById('greeting').innerText = `${greet} • Chromium Browser`;
  </script>
</body>
</html>
