# Shaders Properties for Iris / OptiFine (Minecraft 1.21.11)

# Framebuffer formats
buffers.colortex0.format=RGBA16F
buffers.colortex1.format=RGBA16F
buffers.colortex2.format=RGBA8
buffers.colortex3.format=RGBA16F

# Shadow map configuration
shadowMapResolution=4096
shadowDistance=160.0
shadowDistanceRenderMul=1.0
shadowIntervalSize=2.0
shadowHardwareFiltering=true
shadowtex0.format=DEPTH24
shadowtex1.format=DEPTH24
shadowcolor0.format=RGBA8

# Options Configuration
option.SHADOWS=true
option.SHADOW_QUALITY=2
option.SHADOW_QUALITY.comment=Controls PCF shadow sample quality. 0: Off, 1: Fast (3x3), 2: High (5x5).
value.SHADOW_QUALITY.0=OFF
value.SHADOW_QUALITY.1=MEDIUM
value.SHADOW_QUALITY.2=HIGH

option.GODRAYS=true
option.GODRAYS.comment=Enable volumetric sun rays / crepuscular godrays.
option.GODRAYS_DENSITY=0.65
option.GODRAYS_DENSITY.comment=Density and brightness of volumetric godrays.
screen.GODRAYS_DENSITY.min=0.1
screen.GODRAYS_DENSITY.max=2.0
screen.GODRAYS_DENSITY.step=0.05

option.ATMOSPHERIC_FOG=true
option.ATMOSPHERIC_FOG.comment=Enable Rayleigh and Mie atmospheric fog scattering.

option.WATER_WAVES=true
option.WATER_WAVES.comment=Enable procedural wave normal mapping and Fresnel reflections on water.

option.WAVING_PLANTS=true
option.WAVING_PLANTS.comment=Enable wind waving animation for leaves, grass, and crops.

option.SSAO=true
option.SSAO.comment=Enable Screen Space Ambient Occlusion for soft contact shadows.

option.BLOOM=true
option.BLOOM.comment=Enable glowing bloom effect for bright lights and emissive surfaces.
option.BLOOM_STRENGTH=0.4
screen.BLOOM_STRENGTH.min=0.0
screen.BLOOM_STRENGTH.max=1.0
screen.BLOOM_STRENGTH.step=0.05

option.TONEMAPPING_MODE=1
option.TONEMAPPING_MODE.comment=Tonemapping curves: 0: Linear, 1: ACES Filmic, 2: Reinhard.
value.TONEMAPPING_MODE.0=LINEAR
value.TONEMAPPING_MODE.1=ACES
value.TONEMAPPING_MODE.2=REINHARD

option.SATURATION=1.1
screen.SATURATION.min=0.5
screen.SATURATION.max=2.0
screen.SATURATION.step=0.05

option.CONTRAST=1.05
screen.CONTRAST.min=0.5
screen.CONTRAST.max=2.0
screen.CONTRAST.step=0.05

# Organize Options Screens
screen=SHADOWS GODRAYS WATER_WAVES WAVING_PLANTS ATMOSPHERIC_FOG SSAO BLOOM TONEMAPPING_MODE
screen.SHADOWS=SHADOW_QUALITY
screen.GODRAYS=GODRAYS GODRAYS_DENSITY
screen.BLOOM=BLOOM BLOOM_STRENGTH
